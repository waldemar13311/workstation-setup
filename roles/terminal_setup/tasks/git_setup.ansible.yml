- name: Remove the conflicting Homebrew Git completion script (macOS)
  # Brew ставит урезанный _git (к примеру, без автодополнения stash); удаляем, чтобы
  # использовался полный системный из CLT (Command Line Tools). Файл возвращается при каждом
  # обновлении git - поэтому задача должна выполняться всегда
  ansible.builtin.file:
    path: /opt/homebrew/share/zsh/site-functions/_git
    state: absent
  when: ansible_os_family == 'Darwin'

- name: Disable bold in git color output
  # Жирность зарезервирована за grep'ом (GREP_COLORS в variables.zsh), остальной
  # вывод git - обычное начертание. Яркие цвета (brightgreen/brightcyan)
  # компенсируют яркость, которую раньше давала жирность.
  # git_config не переписывает весь ~/.gitconfig, а правит только эти ключи -
  # ручные настройки пользователя (user.name, core.pager и т.д.) не трогаются.
  # Дефолты, которые переопределяем: color.diff.meta = bold,
  # color.status.header = bold, color.decorate.branch/HEAD = bold
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: "color.diff.meta", value: "normal" }
    - { name: "color.diff.func", value: "normal" }
    - { name: "color.status.header", value: "normal" }
    - { name: "color.decorate.branch", value: "brightgreen" }
    - { name: "color.decorate.HEAD", value: "brightcyan" }

- name: Print git branch without pager (like cat)
  # git branch открывается в less даже при коротком списке веток - неудобно.
  # pager.branch=false отключает пейджер только для branch: вывод идёт прямо
  # в терминал, как у cat. git log и остальные подкоманды продолжают использовать
  # пейджер.
  community.general.git_config:
    name: pager.branch
    value: "false"
    scope: global
