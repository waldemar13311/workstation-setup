---
# vault: zip из Yandex-зеркала releases.hashicorp.com (в apt его нет);
# бинарник копируется в ~/.local/bin. ~/.local/bin создаётся в tasks/main.yml.
# Ссылка и пиновая версия - в vars/Debian/vault_vars.yml.
- name: Download vault zip (Debian)
  # checksum: SHA256SUMS зеркала - get_url сам сверит хеш скачанного zip
  ansible.builtin.get_url:
    url: >-
      {{ terminal_setup_vault_url_base }}/vault/{{ terminal_setup_vault_version }}/vault_{{
      terminal_setup_vault_version }}_linux_{{ terminal_setup_linux_arch }}.zip
    dest: "/tmp/vault-{{ terminal_setup_vault_version }}.zip"
    mode: "0644"
    checksum: >-
      sha256:{{ terminal_setup_vault_url_base }}/vault/{{ terminal_setup_vault_version }}/vault_{{
      terminal_setup_vault_version }}_SHA256SUMS

- name: Ensure vault extract directory exists (Debian)
  ansible.builtin.file:
    path: "/tmp/vault-{{ terminal_setup_vault_version }}-extracted"
    state: directory
    mode: "0755"

- name: Extract vault binary (Debian)
  ansible.builtin.unarchive:
    src: "/tmp/vault-{{ terminal_setup_vault_version }}.zip"
    dest: "/tmp/vault-{{ terminal_setup_vault_version }}-extracted"
    creates: "/tmp/vault-{{ terminal_setup_vault_version }}-extracted/vault"

- name: Install vault to ~/.local/bin (Debian)
  ansible.builtin.copy:
    src: "/tmp/vault-{{ terminal_setup_vault_version }}-extracted/vault"
    dest: "{{ [ansible_user_dir, '.local/bin', 'vault'] | path_join }}"
    mode: "0755"
    remote_src: true

# Автодополнение vault (_vault) разворачивается общей задачей
# Deploy custom zsh completions в tasks/main.yml из files/completions/.
