---
# Переменные для macOS (Homebrew).
# Подключаются в tasks/main.yml по ansible_os_family == 'Darwin'.

# Соответствие ansible_architecture -> суффикс релизов (darwin_*)
# (используется в *_vars.yml для скачивания бинарников)
terminal_setup_darwin_arch_map:
  x86_64: "amd64"
  arm64: "arm64"

# Путь к antidote.zsh - используется в .zshrc и хендлере инициализации плагинов
terminal_setup_antidote_init: "$(brew --prefix)/opt/antidote/share/antidote/antidote.zsh"

# Каталоги cli-плагинов docker (buildx, compose) для ~/.docker/config.json
terminal_setup_docker_cli_plugins_dirs:
  - "/opt/homebrew/lib/docker/cli-plugins"
  - "/usr/local/lib/docker/cli-plugins"

terminal_setup_modern_console_utils:
  - "bat"         # Замена cat
  - "eza"         # Замена ls
  - "zoxide"      # Продвинутый cd
  - "fd"          # Замена find
  - "fzf"         # Полезные виджеты
  - "trash-cli"   # Замена rm (для удаления файлов в корзину)

terminal_setup_console_utils:
  - "golang"          # Язык go
  - "kubectl"         # K8s клиент
  - "kubectx"         # Менеджер контекстов k8s + менеджер namespaces-ов k8s
  - "jq"              # JSON-парсер
  - "wget"            # Загрузчик файлов
  - "ncdu"            # Анализатор занятого дискового пространства
  - "tldr"            # Упрощенные и лаконичные man-страницы
  - "uv"              # Современный менеджер пакетов для python
  - "ansible-lint"    # Линтер для ansible
  - "tenv"            # Универсальный установщик OpenTofu, Terraform, Terragrunt и Atmos
  - "docker"          # Консольный Docker CLI клиент (команды docker ps, run, build)
  - "docker-compose"  # v2 версия docker compose плагина
  - "docker-buildx"   # buildx плагин для docker
  - "colima"          # Легковесный движок-контейнеризатор (замена Docker Desktop)
  - "vim"             # Текстовый редактор
  - "htop"            # Консольный диспетчер задач
  - "fastfetch"       # Вывод базовой информации о системе
  - "gitlab-ci-local" # Для локального запуска gitlab pipeline
  - "curl"            # Не apple-овский curl
  - "git"             # Не apple-овский git
  - "zsh"             # Zsh из brew, назначается логин-шеллом по умолчанию в tasks/zsh_setup.ansible.yml
  - "openssl@3"       # Пакет для работы с сертификатами
  # - "ollama"          # llm пакетный менеджер

# Инструменты, которые ставим не через Homebrew - аналог
# terminal_setup_debian_extra_tools, по файлу на инструмент. Чтобы добавить
# новый:
#   1) допишите имя в этот список;
#   2) создайте vars/Darwin/<имя>_vars.yml - параметры установки (URL, версия, пин);
#   3) создайте tasks/darwin_tools/<имя>_setup.ansible.yml - шаги установки
#      по аналогии с соседними файлами.
terminal_setup_darwin_extra_tools:
  - "vault"  # бинарник из Yandex-зеркала releases.hashicorp.com
